name: stonfi-lockfile

on:
  push:
    branches:
      - design/accepted-gram-refresh
    paths:
      - .github/workflows/stonfi-lockfile.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/accepted-gram-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install STON.fi SDK packages
        run: npm install @ston-fi/sdk @ston-fi/api
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "dex: add stonfi sdk dependencies"
            git push origin HEAD:design/accepted-gram-refresh
          fi
